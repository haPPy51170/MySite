```html
{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Nebula Portfolio
        {% endblock %}
    </title>

    <!-- Font Awesome -->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Main CSS -->
    <link
            rel="stylesheet"
            href="{% static 'css/style.css' %}">

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <!-- Background -->
    <div class="background">

        <div class="background-orb orb-1"></div>
        <div class="background-orb orb-2"></div>
        <div class="background-orb orb-3"></div>

    </div>


    <!-- Custom Cursor -->
    <div id="cursor-layer">

        <div class="cursor"></div>

        <div class="cursor-dot"></div>

    </div>


    <!-- Header -->
    <header class="header">

        <div class="container">

            <nav class="navbar">

                <a
                        href="/"
                        class="logo">

                    <span>N</span>ebula

                </a>


                <div class="nav-links">

                    <a href="/">
                        خانه
                    </a>

                    <a href="/#about">
                        درباره من
                    </a>

                    <a href="/#projects">
                        پروژه‌ها
                    </a>

                    <a href="/#blog">
                        وبلاگ
                    </a>

                    <a href="/#contact">
                        تماس
                    </a>

                    <div class="nav-login">

                        <a href="{% url 'login' %}">
                            ورود
                        </a>

                    </div>

                </div>

            </nav>

        </div>

    </header>


    <!-- Main Content -->
    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="container">

            <div class="footer-content">

                <p>
                    © 2026 Nebula Portfolio
                </p>

            </div>

        </div>

    </footer>


    <!-- JavaScript -->
    <script
            src="{% static 'js/Rapp.js' %}">
    </script>

    {% block extra_js %}
    {% endblock %}

</body>

</html>
```
